name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — nothing here is worth
# paying for twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated Prisma client is not committed, and both typecheck and
      # the logistics tests import types from it.
      - run: pnpm prisma generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  # No secrets and no backend: this only proves the config is well-formed and
  # every tenant file fits the schema the module declares.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - run: tofu -chdir=infra fmt -check -recursive

      - run: tofu -chdir=infra init -backend=false -input=false

      - run: tofu -chdir=infra validate
        env:
          TF_VAR_state_passphrase: validate-only-000000
